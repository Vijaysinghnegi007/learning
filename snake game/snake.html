<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snake game</title>
    <style>
      /* ===== CSS RESET ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      :root {
        --bg-primary-color: #0f0e0e;
        --bg-fill-color: #ffffff;
        --text-primary-color: #f3f3f3;

        /* spacing */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-2xl: 40px;
        --space-3xl: 48px;

        /* border color  */
        --border-primary-color: #2a2929;

        /* border radius  */
        --border-radius-xs: 4px;
        --border-radius-sm: 8px;
        --border-radius-md: 12px;
        --border-radius-lg: 16px;
        --border-radius-xl: 20px;
        --border-radius-2xl: 24px;
        --border-radius-3xl: 28px;
        --border-radius-full: 999px;
      }

      html {
        background-color: var(--bg-primary-color);
        color: var(--text-primary-color);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      main,
      section {
        width: 100%;
        height: 100%;
      }

      section {
        padding: var(--space-2xl);
        display: flex;
        flex-direction: column;
        gap: var(--space-xl);
        height: 100%;
      }

      section .infos {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .info {
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--border-primary-color);
        border-radius: var(--border-radius-sm);
      }

      /* board  */
      .board {
        border: 1px solid var(--border-primary-color);
        flex-grow: 1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
        grid-template-rows: repeat(auto-fill, minmax(30px, 1fr));
      }

      .block {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border-primary-color);
      }
      .fill {
        background-color: var(--bg-fill-color);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="infos">
          <div class="info">
            <h3>High Score: <span id="high-score">0</span></h3>
          </div>
          <div class="info">
            <h3>Score: <span id="score">0</span></h3>
          </div>
          <div class="info">
            <h3>Time: <span id="time">00-00</span></h3>
          </div>
        </div>
        <div class="board"></div>
      </section>
    </main>

    <script>
      const board = document.querySelector(".board");
      const blockHeight = 30;
      const blockWidth = 30;

      const rows = Math.floor(board.clientHeight / blockHeight);
      const cols = Math.floor(board.clientWidth / blockWidth);

      let blocks = [];

      let snake = [
        { x: 1, y: 3 },
        { x: 1, y: 4 },
        { x: 1, y: 5 },
      ];

      let direction = "left";

      //   for (let i = 0; i < rows * cols; i++) {
      //     const block = document.createElement("div");
      //     block.classList.add("block");
      //     board.append(block);
      //   }

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const block = document.createElement("div");
          block.classList.add("block");
          board.append(block);
          blocks[`${row}-${col}`] = block;
        }
      }

      function render() {
        snake.forEach((element) => {
          blocks[`${element.x}-${element.y}`].classList.add("fill");
        });
      }

    </script>
  </body>
</html>
